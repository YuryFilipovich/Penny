services:
  penny:
    build: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DAILY_RECEIPT_LIMIT: ${DAILY_RECEIPT_LIMIT:-10}
      RECEIPT_TIMEZONE: Europe/Warsaw
      DAILY_USAGE_FILE: /app/usage/daily-usage.json
      APP_ORIGINS: ${APP_ORIGINS:-http://127.0.0.1:18787}
    ports:
      - "${PENNY_BIND_IP:-127.0.0.1}:${PENNY_PORT:-18787}:8787"
    volumes:
      - penny-usage:/app/usage
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  penny-usage:
